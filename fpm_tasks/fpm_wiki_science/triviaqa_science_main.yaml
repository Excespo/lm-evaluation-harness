task: triviaqa_science_main
dataset_path: json
dataset_kwargs:
  data_files:
    train: /aistor/sjtu/hpc_stor01/home/luoyijie/data/wikipedia/triviaqa/categorized_by_wiki_main_topics/Science.jsonl
output_type: generate_until
training_split: train
validation_split: train
doc_to_text: "Question: {{question}}?\nAnswer:"
doc_to_target: "{{answer.aliases}}"
should_decontaminate: true
doc_to_decontamination_query: question
generation_kwargs:
  until:
    - "\n"
    - "."
    - ","
  do_sample: false
  temperature: 0.0
filter_list:
  - name: remove_whitespace
    filter:
      - function: remove_whitespace
      - function: take_first
target_delimiter: " "
metric_list:
  - metric: exact_match
    aggregation: mean
    higher_is_better: true
    ignore_case: true
    ignore_punctuation: true
metadata:
  version: 3.0