task: nq_open_humanities_main
dataset_path: json
dataset_kwargs:
  data_files:
    train: /aistor/sjtu/hpc_stor01/home/luoyijie/data/wikipedia/nq_open/categorized_by_wiki_main_topics/Humanities.jsonl
output_type: generate_until
training_split: train
validation_split: train
description: "Answer these questions:\n\n"
doc_to_text: "Q: {{question}}?\nA:"
doc_to_target: "{{answer}}"
fewshot_delimiter: "\n"
generation_kwargs:
  until:
    - "\n"
    - "."
    - ","
  do_sample: false
  temperature: 0.0
filter_list:
  - name: remove_whitespace
    filter:
      - function: remove_whitespace
      - function: take_first
target_delimiter: " "
metric_list:
  - metric: exact_match
    aggregation: mean
    higher_is_better: true
    ignore_case: true
    ignore_punctuation: true
    regexes_to_ignore:
    - "\\b(?:The |the |An |A |The |a |an )"
metadata:
  version: 1.0 