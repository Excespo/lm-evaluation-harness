tag: fpm_finance
task: fbp
dataset_path: /aistor/aispeech/hpc_stor01/home/mada00sx/data/yijie.luo/sft/raw/finance/AdaptLLM/FBP
output_type: multiple_choice
training_split: train
test_split: test
doc_to_text: "Question: What is the sentiment of this sentence from finantial news? Please choose an answer from {negative/neutral/positive}. Sentence: {{text}}\nAnswer:"
doc_to_target: "{{label}}"
doc_to_choice: ["neutral","negative","positive"]

metric_list:
  - metric: acc
    aggregation: mean
    higher_is_better: true
  - metric: f1
    aggregation: !function utils.weighted_f1_score
    average: weighted

metadata:
  version: 1.0